<!doctype html>
<!-- Offline reproduction of the WriteBiz "Drive Other Car Coverage - Broadened Coverage For Named Individuals" schedule dialog:
     the coverage dialog will not save until it has scheduled items; "Add Scheduled Item" opens a nested item dialog with the
     Collision / Other Than Collision checkboxes. Saving an item re-renders the parent dialog, which is hidden for ?hideMs=
     (default 1500) - the second "Add Scheduled Item" click used to land while it was hidden and open nothing. -->
<html><head><meta charset="utf-8"><title>Mock schedule</title>
<style>.modal{display:none;border:1px solid #333;padding:8px;margin:6px}.modal.show{display:block}</style></head>
<body>
<table><tbody>
  <tr><td>Coverage</td><td></td><td>Drive Other Car Coverage - Broadened Coverage For Named Individuals</td><td>CA</td>
      <td id="act"><button data-action="Add" onclick="openParent()"><i class="fa-plus-circle"></i>Add</button></td></tr>
</tbody></table>
<div class="modal" id="parent"><h4 class="modal-title">Drive Other Car Coverage - Broadened Coverage For Named Individuals</h4>
  <div id="items"></div><span class="text-danger" id="perr"></span>
  <button id="btnAddItem" onclick="addItem()">Add Scheduled Item</button> <button onclick="saveParent()">Save</button> <button onclick="cancelParent()">Cancel</button></div>
<div class="modal" id="item"><h4 class="modal-title">Scheduled Item</h4>
  <label><input type="checkbox" id="cbCA7DOCCovBroadCovForNamedIndivsCollision"> Broadened Coverage For Named Individuals Collision</label><br>
  <label><input type="checkbox" id="cbCA7DOCCovBroadCovForNamedIndivsOthThanCollision"> Broadened Coverage For Named Individuals Other Than Collision</label><br>
  <span class="FieldSpacing">Name <input type="text" id="txtName"></span>
  <!-- ?terms=1 (QA 11/06): the item's own terms, shown for the ticked coverage; Deductible Type follows Losses Covered -->
  <div id="colTerms" style="display:none"><div class="FieldSpacing"><span class="FieldLabel">Deductible</span>
    <select><option selected>Not Applicable</option><option>50</option><option>100</option><option>500</option></select></div></div>
  <div id="otcTerms" style="display:none"><div class="FieldSpacing"><span class="FieldLabel">Losses Covered</span>
    <select id="lc"><option selected>Comprehensive</option><option>Specified Causes Of Loss</option></select></div>
    <div class="FieldSpacing"><span class="FieldLabel">Deductible Type</span><select id="dt"><option>Comprehensive All Perils Deductible</option></select></div></div>
  <button onclick="saveItem()">Save</button></div>
<script>
const hideMs = Number(new URLSearchParams(location.search).get('hideMs') ?? 1500);
const btnDelay = Number(new URLSearchParams(location.search).get('btnDelay') ?? 0);
const dupHidden = new URLSearchParams(location.search).get('dupHidden') === '1';
// ?brokenFirst=1 (PA Auto Dealers 11/04): the first time the coverage dialog is open its items never save - only a second try works
const brokenFirst = new URLSearchParams(location.search).get('brokenFirst') === '1';
const withTerms = new URLSearchParams(location.search).get('terms') === '1';
if (withTerms) {
  const show = () => { $('colTerms').style.display = $('cbCA7DOCCovBroadCovForNamedIndivsCollision').checked ? '' : 'none'; $('otcTerms').style.display = $('cbCA7DOCCovBroadCovForNamedIndivsOthThanCollision').checked ? '' : 'none'; };
  document.addEventListener('change', (e) => {
    if (e.target.type === 'checkbox') show();
    if (e.target.id === 'lc') $('dt').innerHTML = e.target.value === 'Specified Causes Of Loss' ? '<option>Specified Causes Of Loss All Perils Deductible</option>' : '<option>Comprehensive All Perils Deductible</option><option>Comprehensive All Perils Deductible With Full Glass Coverage</option>';
  });
}
let opens = 0;
window.__items = []; window.__saved = false;
const $ = (id) => document.getElementById(id);
function openParent() { opens++; $('parent').classList.add('show'); }
function cancelParent() { $('parent').classList.remove('show'); $('item').classList.remove('show'); }
function addItem() {
  if (!$('parent').classList.contains('show')) return;
  if (brokenFirst && opens < 2) return;
  ['cbCA7DOCCovBroadCovForNamedIndivsCollision', 'cbCA7DOCCovBroadCovForNamedIndivsOthThanCollision'].forEach((i) => { $(i).checked = false; });
  $('txtName').value = ''; $('colTerms').style.display = 'none'; $('otcTerms').style.display = 'none'; $('item').classList.add('show');
}
function saveItem() {
  const picks = [...$('item').querySelectorAll('input[type=checkbox]')].filter((c) => c.checked).map((c) => c.id.replace(/^cbCA7DOCCovBroadCovForNamedIndivs/, ''));
  if (!picks.length || !$('txtName').value) return;
  window.__items.push(picks.join('+'));
  $('item').classList.remove('show');
  $('parent').classList.remove('show'); // re-render
  setTimeout(() => { $('items').textContent = 'Items: ' + window.__items.join(', '); $('parent').classList.add('show'); }, hideMs);
}
function saveParent() {
  if (!window.__items.length) {
    // the dealer form re-renders the dialog as "Edit ..." and the Add Scheduled Item button only comes back after ?btnDelay= ms
    $('perr').textContent = 'At least one scheduled item is required';
    const b = $('btnAddItem'); b.style.display = 'none'; setTimeout(() => { b.style.display = ''; }, btnDelay);
    // ?dupHidden=1 (PA/AZ Auto Dealers 11/03): the re-rendered "Edit ..." dialog also holds a HIDDEN "Add Scheduled Item"
    // button ahead of the real one, so a plain first-match locator never becomes visible
    if (dupHidden && !$('dupBtn')) b.insertAdjacentHTML('beforebegin', '<span id="dupBtn" style="display:none"><button>Add Scheduled Item</button></span>');
    return;
  }
  window.__saved = true; $('parent').classList.remove('show');
  $('act').innerHTML = '<i class="fa-trash"></i>';
}
</script></body></html>
